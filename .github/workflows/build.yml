name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (pet logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/host -B build/host
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  firmware:
    name: Firmware (ESP-IDF v5.5)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware set-target esp32c6 build
      - uses: actions/upload-artifact@v4
        with:
          name: tomogotchi-firmware
          path: |
            firmware/build/tomogotchi.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
