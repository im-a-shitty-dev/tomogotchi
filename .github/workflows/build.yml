name: Build

# PRs only (no push builds), so each change builds once. Use "Run workflow"
# in the Actions tab for a manual build of any branch, e.g. main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (pet logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/host -B build/host
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  sprites:
    name: Sprites (generated C matches PNGs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=10"
      - run: python tools/sprites/build.py --check

  firmware:
    name: Firmware ${{ matrix.target }} (ESP-IDF v5.5)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        # The same Waveshare board, with an ESP32-C6 or an ESP32-S3.
        target: [esp32c6, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware -B firmware/build-${{ matrix.target }} -DIDF_TARGET=${{ matrix.target }} build
      - uses: actions/upload-artifact@v4
        with:
          name: tomogotchi-firmware-${{ matrix.target }}
          path: |
            firmware/build-${{ matrix.target }}/tomogotchi.bin
            firmware/build-${{ matrix.target }}/bootloader/bootloader.bin
            firmware/build-${{ matrix.target }}/partition_table/partition-table.bin
            firmware/build-${{ matrix.target }}/flash_args
