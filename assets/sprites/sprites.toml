pikachu = { smirk = "pikachu/smirk", fang = "pikachu/fang", happy = "pikachu/happy", annoyed = "pikachu/annoyed", sleep = "pikachu/sleep", shades = "pikachu/shades" }
jason = { blank = "", blink = "jason/blink", smirk = "jason/smirk", fang = "jason/smirk", happy = "jason/smirk", annoyed = "jason/annoyed", grumpy = "", grumpyblink = "", dizzy = "jason/blink", sleep = "jason/smirk", screen = "", read = "", shades = "jason/smirk" }
