# Every sprite the firmware knows about. tools/sprites/build.py turns this
# and the PNGs into firmware/components/sprites/sprites_gen.{c,h}.
#
# Each name is a PNG at <group>/<name>.png, drawn on the 52x64 canvas.
# A PNG N*52 pixels wide is an N-frame animation strip.
# List order sets the C enum values.

bg = ["deadpan", "morning", "commute", "bath", "couch", "beach", "night", "asleep", "spooky"]
fx = ["waves", "tunnel", "stars", "steam", "zzz", "bat", "splash", "foam", "rain", "sparkle", "tail_pikachu", "tail_pikachu_back", "tail_sylveon", "tail_sylveon_back", "tail_trex", "tail_trex_back", "tail_trike", "tail_trike_back", "ribbons_sylveon", "ribbons_sylveon_back"]
body = ["casual", "coat", "dracula", "chiikawa", "sadako", "trex", "barrel", "pikachu", "jason", "trike", "sylveon", "pjs", "pjs_phone", "pjs_switch", "head", "couch", "beach", "casual_back", "dracula_back", "chiikawa_back", "sadako_back", "trex_back", "barrel_back", "pikachu_back", "jason_back", "trike_back", "sylveon_back", "pjs_back", "bath_back", "couch_hand", "beach_hand"]
face = ["blank", "blink", "smirk", "fang", "happy", "annoyed", "grumpy", "grumpyblink", "dizzy", "sleep", "screen", "read", "shades"]
prop = ["phone", "cup", "bedhead", "gummy", "crisps", "coffee", "gummy_icon", "crisps_icon", "coffee_icon"]
front = ["tub", "blanket", "bath_arm"]
# Peek strip (clock, hearts), pop-up hearts, and the emotes by his head
# (art at 1,1 inside its outline). Drawn by scene code at offsets.
hud = ["digits", "colon", "heart", "heart_empty", "pop_up", "pop_down", "pop_down_beach", "emote_vein", "emote_heart", "emote_note", "emote_swirl", "emote_bang", "emote_dots", "emote_zzz"]

# Faces and props are drawn at the body's head offset. Bodies not listed
# use [0, 0]. Lying poses have the head further left and lower.
[head_offset]
couch = [-12, 7]
beach = [-11, 3]
couch_hand = [-12, 7]
beach_hand = [-11, 3]

# Snacks are cut in the standing hand. Bodies whose hand is elsewhere
# (back views, lying with a free hand, the bath arm for head) list how far.
[hand_offset]
head = [6, -17]
couch_hand = [1, -17]
beach_hand = [-5, -20]
casual_back = [2, 0]
dracula_back = [2, 0]
chiikawa_back = [2, 0]
sadako_back = [2, 0]
trex_back = [2, 0]
barrel_back = [2, 0]
pikachu_back = [2, 0]
jason_back = [2, 0]
trike_back = [2, 0]
sylveon_back = [2, 0]
pjs_back = [2, 0]
bath_back = [-26, -8]

# Bodies that need their own face or prop art (masks, hoods over the
# cheeks). The value is a PNG under face/ or prop/ without .png, or "" to
# draw nothing. Anything not listed uses face/<face>.png or prop/<prop>.png.

[face_override]
chiikawa = { blank = "", blink = "chiikawa/blink", smirk = "chiikawa/smirk", fang = "chiikawa/smirk", happy = "chiikawa/smirk", annoyed = "", grumpy = "", grumpyblink = "", dizzy = "", sleep = "chiikawa/sleep", screen = "", read = "", shades = "chiikawa/smirk" }
sadako = { blank = "", blink = "sadako/blink", smirk = "", fang = "", happy = "", annoyed = "", grumpy = "", grumpyblink = "", dizzy = "", sleep = "", screen = "", read = "", shades = "" }
trex = { annoyed = "trex/annoyed" }
